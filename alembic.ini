# =============================================================================
# Alembic Configuration – EcoPackAI
# =============================================================================
# This file is read by Alembic on every invocation.  It points to the
# migration script directory and configures the target database URL.
#
# Override ``sqlalchemy.url`` at runtime via the environment variable
# ``ECOPACKAI_DATABASE_URL`` (handled in ``migrations/env.py``).
# =============================================================================

[alembic]

# Path to the directory that holds migration environment and version scripts.
script_location = migrations

# Template used to generate migration file names.
# Tokens: %%(year)d, %%(month).2d, %%(day).2d, %%(hour).2d, %%(minute).2d,
#         %%(second).2d, %%(rev)s, %%(slug)s
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering dates within the migration file.
# Requires the ``python-dateutil`` library if set.
# timezone =

# Maximum length for the ``slug`` field.
# truncate_slug_length = 40

# Set to 'true' to run the environment during the ``revision`` command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# in the versions directory.
# sourceless = false

# Version path separator; default is OS-specific (";" on Windows).
# version_path_separator = os

# Output encoding for the generated revision file.
output_encoding = utf-8

# SQLAlchemy connection string.
# Can be overridden by ECOPACKAI_DATABASE_URL in env.py.
sqlalchemy.url = postgresql://ecopackai:ecopackai@localhost:5432/ecopackai

# ---------------------------------------------------------------------------
# Post-write hooks  (optional – e.g. auto-format generated migrations)
# ---------------------------------------------------------------------------
# [post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
